<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahar Tal - Music Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #121212 0%, #1a1a2e 100%);
            color: #f0f0f0;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #ff8800;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: none;
            letter-spacing: 2px;
        }

        #current-song {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.2rem;
            color: #ffcc00;
            border-right: 5px solid #ff8800;
        }

        audio {
            width: 100%;
            margin-bottom: 20px;
            filter: invert(1) hue-rotate(180deg);
        }

        #song-list {
            display: grid;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 10px;
        }

        .song {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song:hover {
            background: rgba(102, 153, 255, 0.3);
            border-right: 4px solid #6699ff;
        }

        .song.active {
            background: rgba(255, 136, 0, 0.2);
            border-right: 4px solid #ff8800;
        }

        #song-list::-webkit-scrollbar { width: 8px; }
        #song-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Shahar Tal 🎵</h1>
        
        <div id="current-song">בוחרים שיר ומתחילים...</div>
        
        <audio id="audio-player" border-radius="10px" controls></audio>
        
        <div id="song-list"></div>
    </div>

    <script>
        let currentSongIndex = -1;

const songs = [
            {
                name: "Trading Music - Minor",
                url: "https://www.dropbox.com/scl/fi/v4roexx55ry2ebo0gjeze/Trading-Music.mp3?rlkey=vtljpnrcebmud0z2b5esdi7yz&st=v7wkj6og&raw=1"
            },
            {
                name: "Jazz Lounge",
                url: "https://www.dropbox.com/scl/fi/mbjxg9usp2nrti3ddemr3/Vintage-Parisian-Jazz-Lounge-Relaxing-Instrumental-Retro-Jazz-Music.mp3?rlkey=u5bfctphddpv2j04orrmo4j6h&st=rowonz98&raw=1"
            },
            {
                name: "Trading Music - Major",
                url: "https://www.dropbox.com/scl/fi/fw6wymb44ictdlw3wz1sx/Focus-Music-Ambient-Binaural-Beats-For-Deep-Concentration-And-Studying-In-A-Calm-Workspace.mp3?rlkey=chw8m3db41v4lc9e5c0iify11&st=9ee6wbfo&raw=1"
            }

        ];

        const songList = document.getElementById('song-list');
        const audioPlayer = document.getElementById('audio-player');
        const currentSongDisplay = document.getElementById('current-song');

        function loadPlaylist() {
            songList.innerHTML = '';
            songs.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'song';
                div.innerHTML = `<span>${index + 1}. ${song.name}</span> <span>▶️</span>`;
                div.onclick = () => {
                    currentSongIndex = index;
                    playSong(song, div);
                };
                songList.appendChild(div);
            });
        }

        function playSong(song, element) {
            document.querySelectorAll('.song').forEach(s => s.classList.remove('active'));
            if(element) element.classList.add('active');

            audioPlayer.src = song.url;
            currentSongDisplay.textContent = `מנגן כעת: ${song.name}`;
            
            audioPlayer.play().catch(e => {
                console.error(e);
                alert("שגיאה בניגון הקובץ. ודא שהקישור תקין ופעיל.");
            });
        }

        // מעבר אוטומטי לשיר הבא
        audioPlayer.onended = () => {
            currentSongIndex++;
            if (currentSongIndex < songs.length) {
                const allSongs = document.querySelectorAll('.song');
                playSong(songs[currentSongIndex], allSongs[currentSongIndex]);
            } else {
                currentSongDisplay.textContent = "הפלייליסט הסתיים.";
                currentSongIndex = -1;
            }
        };

        loadPlaylist();
    </script>
</body>
</html>
