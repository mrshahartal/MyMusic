<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahar Tal - Music Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(135deg, #121212 0%, #1a1a2e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #ff8800;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            text-transform: none;
            letter-spacing: 1.5px;
        }

        #current-song {
            background: #222;
            padding: 10px 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 0.95rem;
            color: #ffcc00;
            border-left: 4px solid #ff8800;
            direction: ltr;
            text-align: left;
        }

        audio {
            width: 100%;
            height: 36px;
            margin-bottom: 15px;
            filter: invert(1) hue-rotate(180deg);
        }

        #song-list {
            display: grid;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .song {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: ltr;
            text-align: left;
            font-size: 0.9rem;
        }

        .song:hover {
            background: rgba(102, 153, 255, 0.3);
            border-left: 3px solid #6699ff;
        }

        .song.active {
            background: rgba(255, 136, 0, 0.2);
            border-left: 3px solid #ff8800;
        }

        #song-list::-webkit-scrollbar { width: 6px; }
        #song-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
